# This is a Declarative Automation Bundle definition for Databricks-German-Electricity-Price-Forecasting.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: Databricks-German-Electricity-Price-Forecasting

resources:
  jobs:
    ingest_smard:
      name: ingest_smard
      tasks:
        - task_key: ingest_smard
          spark_python_task:
            python_file: ./bronze/01_ingest_smard.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "5"

    daily_pipeline:
      name: daily_pipeline
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"     # every day 08:00
        timezone_id: Europe/Berlin
        pause_status: UNPAUSED                    # explicit: run even though the target is dev
      tasks:
        - task_key: ingest
          spark_python_task:
            python_file: ./bronze/01_ingest_smard.py
          environment_key: default

        - task_key: bronze_table
          depends_on:
            - task_key: ingest
          spark_python_task:
            python_file: ./bronze/02_build_bronze_table.py
          environment_key: default

        - task_key: silver
          depends_on:
            - task_key: bronze_table
          spark_python_task:
            python_file: ./silver/01_build_smard_hourly.py
          environment_key: default

        - task_key: gold
          depends_on:
            - task_key: silver
          spark_python_task:
            python_file: ./gold/01_build_features.py
          environment_key: default

        - task_key: predict
          depends_on:
            - task_key: silver
          spark_python_task:
            python_file: ./ml/03_predict.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - scikit-learn==1.6.1
              - mlflow==3.8.1


targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-ca310085-9983.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-ca310085-9983.cloud.databricks.com